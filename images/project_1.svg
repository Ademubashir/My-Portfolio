      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="bottle1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg1)"/>

  <!-- placeholder banner -->
  <rect x="0" y="0" width="600" height="34" fill="#1e293b"/>
  <text x="300" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f8fafc" text-anchor="middle">PLACEHOLDER — REPLACE WITH ACTUAL IMAGE</text>

  <!-- product card mockup -->
  <rect x="120" y="70" width="360" height="260" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
