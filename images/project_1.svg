  <text x="300" y="370" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#475569" text-anchor="middle">Product Card — Dior Sauvage</text>
  <text x="300" y="388" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Frontend practice project · HTML &amp; CSS</text>
