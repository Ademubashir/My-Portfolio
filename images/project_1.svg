  <rect x="262" y="88" width="76" height="22" rx="4" fill="#94a3b8"/>
  <rect x="250" y="250" width="100" height="14" rx="3" fill="#64748b"/>
  <circle cx="300" cy="200" r="22" fill="none" stroke="#7c3aed" stroke-width="3" opacity="0.7"/>
  <!-- card text lines -->
  <rect x="160" y="285" width="120" height="10" rx="3" fill="#cbd5e1"/>
  <rect x="295" y="285" width="70" height="10" rx="3" fill="#cbd5e1"/>
